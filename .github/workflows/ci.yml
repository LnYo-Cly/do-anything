name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run on main: catches new Rust stable lints and newly published
  # advisories even when nothing was pushed.
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --check

  # Verify the exact package that would be uploaded, including a build from
  # the packaged sources. One Linux runner is enough: the package contents
  # and the verification build do not depend on the operating system.
  package:
    name: Package (crates.io dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package (crates.io dry run)
        run: cargo publish --dry-run --locked

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Clippy (db only)
        run: cargo clippy --all-targets --no-default-features --features db -- -D warnings
      - name: Clippy (log only)
        run: cargo clippy --all-targets --no-default-features --features log -- -D warnings
      - name: Clippy (browser only)
        run: cargo clippy --all-targets --no-default-features --features browser -- -D warnings

  browser:
    name: Browser tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # The browser tests launch the Chrome that the runner already has. A
      # missing browser must fail the job instead of skipping the tests.
      DA_TEST_BROWSER: "1"
      # Several cases launch their own browser; with the default thread count a
      # four-core runner runs four at once and their own 30-second navigation
      # budgets start failing on code that passes locally.
      RUST_TEST_THREADS: "2"
      # A contended runner can spend longer than thirty seconds in
      # `Page.navigate` on a page that loads instantly elsewhere.
      DA_BROWSER_NAVIGATION_TIMEOUT_MS: "90000"
      # Chrome can also take longer to open its debugger port on a
      # contended runner than the built-in thirty seconds.
      DA_BROWSER_LAUNCH_TIMEOUT_MS: "90000"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (browser)
        run: cargo test --test browser

  other_tests:
    name: Other tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Select non-browser test targets
        id: targets
        shell: bash
        run: |
          args="--lib --bins"
          for f in tests/*.rs; do
            name=$(basename "$f" .rs)
            if [ "$name" != "browser" ]; then
              args="$args --test $name"
            fi
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Test
        run: cargo test ${{ steps.targets.outputs.args }}
      - name: Test (no default features)
        run: cargo test --no-default-features ${{ steps.targets.outputs.args }}
      - name: Test (db only)
        run: cargo test --no-default-features --features db ${{ steps.targets.outputs.args }}
      - name: Test (log only)
        run: cargo test --no-default-features --features log ${{ steps.targets.outputs.args }}
      - name: Test (browser only)
        run: cargo test --no-default-features --features browser ${{ steps.targets.outputs.args }}
      - name: Doctests
        run: cargo test --doc

  # The PostgreSQL half of `db.query` needs a server, which the check job does
  # not have: there the tests skip and print why. This job runs them for real
  # against a throwaway container. The password exists only in this file and the
  # database is discarded with the container.
  database:
    name: Database (ubuntu-latest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: da
          POSTGRES_PASSWORD: da-ci-only
          POSTGRES_DB: da
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U da -d da"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DA_TEST_POSTGRES_URL: "postgres://da:da-ci-only@localhost:5432/da?sslmode=disable"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test against PostgreSQL
        run: cargo test --test db

  check_ubuntu:
    name: Check (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [fmt, package, clippy, browser, other_tests]
    if: always()
    steps:
      - name: Verify split jobs
        run: |
          for result in \
            "${{ needs.fmt.result }}" \
            "${{ needs.package.result }}" \
            "${{ needs.clippy.result }}" \
            "${{ needs.browser.result }}" \
            "${{ needs.other_tests.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::Required job did not succeed (result: $result)"
              exit 1
            fi
          done

  check_windows:
    name: Check (windows-latest)
    runs-on: ubuntu-latest
    needs: [clippy, browser, other_tests]
    if: always()
    steps:
      - name: Verify split jobs
        run: |
          for result in \
            "${{ needs.clippy.result }}" \
            "${{ needs.browser.result }}" \
            "${{ needs.other_tests.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::Required job did not succeed (result: $result)"
              exit 1
            fi
          done

  check_macos:
    name: Check (macos-latest)
    runs-on: ubuntu-latest
    needs: [clippy, browser, other_tests]
    if: always()
    steps:
      - name: Verify split jobs
        run: |
          for result in \
            "${{ needs.clippy.result }}" \
            "${{ needs.browser.result }}" \
            "${{ needs.other_tests.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::Required job did not succeed (result: $result)"
              exit 1
            fi
          done

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
