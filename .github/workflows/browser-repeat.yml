name: Browser repeat

on:
  pull_request:
    paths:
      - 'src/drivers/browser/**'
      - 'tests/browser.rs'
      - 'tests/support/**'
      - '.github/workflows/browser-repeat.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  repeat:
    name: Repeat browser tests (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.total_shards }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DA_TEST_BROWSER: "1"
      # Several browser tests each start their own Chrome, so libtest's default
      # one thread per core puts several browsers on a four-core runner at once
      # and Page.navigate misses its 30 s budget. Two threads bound that
      # contention. Job level so the --no-run build step receives it too, where
      # it is inert.
      RUST_TEST_THREADS: "2"
      # A contended runner can spend longer than thirty seconds in
      # `Page.navigate` on a page that loads instantly elsewhere.
      DA_BROWSER_NAVIGATION_TIMEOUT_MS: "90000"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, total_shards: 5, start: 1, end: 6 }
          - { os: ubuntu-latest, shard: 2, total_shards: 5, start: 7, end: 12 }
          - { os: ubuntu-latest, shard: 3, total_shards: 5, start: 13, end: 18 }
          - { os: ubuntu-latest, shard: 4, total_shards: 5, start: 19, end: 24 }
          - { os: ubuntu-latest, shard: 5, total_shards: 5, start: 25, end: 30 }
          - { os: windows-latest, shard: 1, total_shards: 5, start: 1, end: 6 }
          - { os: windows-latest, shard: 2, total_shards: 5, start: 7, end: 12 }
          - { os: windows-latest, shard: 3, total_shards: 5, start: 13, end: 18 }
          - { os: windows-latest, shard: 4, total_shards: 5, start: 19, end: 24 }
          - { os: windows-latest, shard: 5, total_shards: 5, start: 25, end: 30 }
          - { os: macos-latest, shard: 1, total_shards: 3, start: 1, end: 10 }
          - { os: macos-latest, shard: 2, total_shards: 3, start: 11, end: 20 }
          - { os: macos-latest, shard: 3, total_shards: 3, start: 21, end: 30 }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build browser integration tests
        run: cargo test --test browser --no-run
      - name: Run browser tests
        shell: bash
        run: |
          print_diag() {
            iter=$1
            duration=$2
            tmp_dir="${TMPDIR:-${TMP:-${TEMP:-/tmp}}}"
            tmp_dir="${tmp_dir%/}"
            case "$(uname -s)" in
              MINGW* | MSYS* | CYGWIN*)
                chrome_procs=$(tasklist //FO CSV //NH 2>/dev/null | grep -c -i -E 'chrome|chromium' || true)
                ;;
              *)
                chrome_procs=$(ps -A -o comm= 2>/dev/null | grep -c -i -E 'chrome|chromium' || true)
                ;;
            esac
            profiles=0
            for d in "$tmp_dir"/da-chrome-profile*; do
              [ -d "$d" ] && profiles=$((profiles + 1))
            done
            echo "DIAG: iter=$iter duration=${duration}s threads=${RUST_TEST_THREADS:-unset} chrome_procs=$chrome_procs left_profiles=$profiles"
          }

          print_diag 0 0

          for i in $(seq "${{ matrix.start }}" "${{ matrix.end }}"); do
            echo "::group::Iteration $i of 30"
            start_ts=$(date +%s)
            status=0
            cargo test --test browser || status=$?
            end_ts=$(date +%s)
            duration=$((end_ts - start_ts))
            print_diag "$i" "$duration"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::Iteration $i of 30 failed (exit code $status)"
              exit 1
            fi
          done
