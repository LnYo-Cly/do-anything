name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - docs/releases/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Check version and release notes
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::Could not read the version from Cargo.toml"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
          if [ ! -f "docs/releases/v${version}.md" ]; then
            echo "::error::Missing release notes docs/releases/v${version}.md"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, exe: .exe }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, exe: .exe }
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      BIN: target/${{ matrix.target }}/release/da${{ matrix.exe }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target "$TARGET"
      - name: Smoke test
        run: |
          set -u
          actual=$("$BIN" --version)
          if [ "$actual" != "da ${VERSION}" ]; then
            echo "::error::Expected 'da ${VERSION}', got '${actual}'"
            exit 1
          fi

          printf 'name: smoke\nnaem: typo\nsteps: []\n' > invalid.yaml
          code=0; "$BIN" run invalid.yaml || code=$?
          if [ "$code" -ne 3 ]; then
            echo "::error::An invalid case should exit 3, got ${code}"
            exit 1
          fi

          printf 'name: smoke\nsteps:\n  - http.request: { url: "http://127.0.0.1:9/", timeout_ms: 5000 }\n' > unreachable.yaml
          code=0; "$BIN" run unreachable.yaml || code=$?
          if [ "$code" -ne 4 ]; then
            echo "::error::An unreachable target should exit 4, got ${code}"
            exit 1
          fi
          echo "Smoke test passed on ${TARGET}"
      - name: Package
        run: |
          name="da-v${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "$BIN" LICENSE README.md "dist/${name}/"
          cd dist
          if [ "${RUNNER_OS}" = "Windows" ]; then
            7z a -tzip "${name}.zip" "${name}" > /dev/null
          else
            tar czf "${name}.tar.gz" "${name}"
          fi
          rm -rf "${name}"
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: da-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [prepare, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            ${prerelease}

  # Retry a failed crates.io publish with "Re-run failed jobs", not a full
  # workflow re-run: the GitHub Release job above fails when the release already
  # exists, while a failed-job re-run keeps the successful jobs.
  crates-io:
    name: Publish to crates.io
    needs: [prepare, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CRATE: do-anything
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Read-only lookup first: re-running an already published version needs no
      # credentials, and the token reaches only the two steps that need it.
      - name: Check whether this version is already on crates.io
        id: published
        run: |
          code=$(curl --silent --show-error --location --output /dev/null \
            --write-out '%{http_code}' \
            --header "User-Agent: do-anything-release-workflow (https://github.com/LnYo-Cly/do-anything)" \
            "https://crates.io/api/v1/crates/${CRATE}/${VERSION}")
          case "${code}" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Could not check ${CRATE} ${VERSION} on crates.io (HTTP ${code})."
              exit 1
              ;;
          esac
      - name: Require the crates.io token
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. Add a crates.io API token as a repository secret named CARGO_REGISTRY_TOKEN before publishing a release."
            exit 1
          fi
      - name: Publish
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - name: Already published
        if: steps.published.outputs.exists == 'true'
        run: echo "${CRATE} ${VERSION} is already on crates.io; nothing to publish."
