[package]
name = "do-anything"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A declarative test runner for HTTP APIs, command-line programs, SQL databases and browsers."
repository = "https://github.com/LnYo-Cly/do-anything"
homepage = "https://github.com/LnYo-Cly/do-anything"
readme = "README.md"
license = "MIT"
keywords = ["testing", "test-runner", "yaml", "cli", "browser"]
categories = ["development-tools::testing", "command-line-utilities"]
include = ["/src/**", "/README.md", "/README.zh-CN.md", "/LICENSE"]

[[bin]]
name = "da"
path = "src/main.rs"

[features]
default = ["http", "cli", "log", "db", "browser", "mcp", "plugin", "proc", "fs", "ai"]
# Built-in multi-provider model access (`genai`) for `da session` and `da mcp`.
ai = ["dep:genai", "dep:reqwest", "dep:rustls", "dep:tokio"]
# The `http.request` step and the HTTP client it needs.
http = ["dep:schemars", "dep:ureq"]
# The `cli.run` step and the child-process timeout it needs.
cli = ["dep:schemars", "dep:wait-timeout"]
# The `log.file` observer and the argument schema it needs.
log = ["dep:schemars"]
# The `fs.watch` observer and the argument schema it needs.
fs = ["dep:schemars"]
# The `proc.*` steps for long-lived process sessions.
proc = ["dep:schemars", "dep:process-wrap"]
# The `db.query` step and the two database clients it needs.
db = [
    "dep:schemars",
    "dep:rusqlite",
    "dep:postgres",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
]
# The `browser.*` steps and the Chrome DevTools Protocol client they need.
browser = ["dep:schemars", "dep:tungstenite"]
# The `android.*` steps, which drive a device by spawning `adb`. It is off by
# default because it is only useful on a machine with an Android device.
android = ["dep:schemars"]
# The `desktop.*` steps for native desktop UI automation (Windows UIA, Linux
# AT-SPI2 + X11, macOS AXUIElement). Off by default because it drives a local
# graphical session.
desktop = [
    "dep:schemars",
    "dep:png",
    "dep:uiautomation",
    "dep:win-screenshot",
    "dep:zbus",
    "dep:x11rb",
    "dep:axuielement",
    "dep:enigo",
]
# The MCP JSON-RPC 2.0 server.
mcp = []
# External plugins over synchronous stdio JSON-RPC 2.0.
plugin = ["dep:schemars"]

[[bin]]
name = "da-plugin-fixture"
path = "tests/fixtures/fixture_plugin.rs"
required-features = ["plugin"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
jsonpath-rust = "1.0"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
serde_json = "1"
schemars = { version = "1.2", optional = true }
ureq = { version = "3.5", default-features = false, features = ["json", "rustls"], optional = true }
wait-timeout = { version = "0.2", optional = true }
# `bundled` compiles the SQLite C sources, so no system library is needed and
# the read-only open flag is always available. `hooks` adds the authorizer that
# refuses a statement while it is prepared.
rusqlite = { version = "0.43", features = ["bundled", "hooks"], optional = true }
postgres = { version = "0.19", features = ["with-serde_json-1"], optional = true }
tokio-postgres-rustls = { version = "0.14", features = ["ring", "webpki-roots"], optional = true }
# Only to install the crypto provider `tokio-postgres-rustls` and `reqwest` ask
# for; this is the same crate and version `ureq` already builds with.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
# Multi-provider LLM/VLM client for `da session` and `da mcp`; TLS is injected
# through `reqwest` with `ring` rather than `aws-lc-rs`.
genai = { version = "0.7", default-features = false, optional = true }
# Injected HTTP client for `genai` using the workspace `ring` rustls provider.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"], optional = true }
# Single-threaded runtime and deadline timer used only inside `ai` model calls.
tokio = { version = "1", default-features = false, features = ["rt", "time"], optional = true }
# The synchronous WebSocket client the DevTools Protocol connection speaks.
# Only the plain `ws://` handshake is used, so no TLS feature is enabled.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
# Encodes and decodes masked RGBA window captures to PNG without pulling in `image`.
png = { version = "0.18", optional = true }

[target.'cfg(windows)'.dependencies]
# Safe wrapper around Windows `IUIAutomation` COM interfaces and `SendInput`.
uiautomation = { version = "0.25", optional = true }
# Safe `PrintWindow` RGBA capture and `EnumWindows` enumeration; shares the
# exact `windows` crate version `uiautomation` already builds with.
win-screenshot = { version = "4.0", optional = true }
# Assigns spawned `proc.*` child trees to a kill-on-close Windows Job Object
# before resuming the child, so intermediate parent exits never orphan
# descendants. Reuses `windows` and `indexmap` already in `Cargo.lock`.
process-wrap = { version = "11.0", default-features = false, features = ["std", "job-object", "kill-on-drop"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust synchronous D-Bus client (`async-io`, no `tokio`) for AT-SPI2.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"], optional = true }
# Pure-Rust X11 socket client for `GetImage` window capture and `XTEST` input.
x11rb = { version = "0.14", default-features = false, features = ["xtest", "image"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Safe wrapper around macOS `AXUIElement` Accessibility APIs.
axuielement = { version = "0.10", optional = true }
# Safe `CGEvent` keyboard and mouse fallback for `desktop.press` and `at:`.
enigo = { version = "0.6", default-features = false, optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# The print macros panic when standard output or standard error cannot be
# written, for example when the reader closes the pipe early. Write through
# fallible helpers so the run keeps its own exit code.
print_stdout = "deny"
print_stderr = "deny"

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
